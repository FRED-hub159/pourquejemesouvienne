/* ===================================== */
/* VERSION TELE RETRO VALIDE */
/* ===================================== */

.tv-retro{
    position:relative;
    width:100%;
    max-width:700px;
    margin:40px auto;
}

.tv-screen{

    position:absolute;

    top:25%;
    left:16.5%;

    width:65%;
    height:43%;

    overflow:hidden;

    background:black;

    z-index:1;

    border-radius:10px;

}



/* reflet du verre */

.tv-screen::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;
    bottom:0;

    pointer-events:none;

    background:
    linear-gradient(
        130deg,
        rgba(255,255,255,0.10),
        transparent 35%
    );
    z-index:3;
}
    
/* assombrissement des bords */

.tv-screen::after{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;
    bottom:0;

    pointer-events:none;

    background:
    radial-gradient(
        ellipse at center,
        transparent 65%,
        rgba(0,0,0,0.25) 100%
    );

    z-index:2;
}

.tv-screen iframe,
.tv-screen video{
    width:100%;
    height:100%;
    border:none;
}

.tv-image{
    position:relative;
    width:100%;
    display:block;
    z-index:0;
    opacity:0.5;
}

footer{
    text-align:center;
    padding:30px;
    color:#aaa;
}
