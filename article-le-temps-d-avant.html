<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Article rétro – Pour que je me souvienne</title>

<style>
    body {
        background-color: #f7f3e9; /* ton fond beige */
        font-family: "Georgia", serif;
        margin: 0;
        padding: 0;
        color: #3d2f24;
    }

    header {
        text-align: center;
        padding: 40px 20px 10px;
    }

    header h1 {
        font-size: 2.4em;
        margin-bottom: 8px;
        color: #5a3e2b;
    }

    header .date {
        font-size: 1em;
        color: #7a6a5f;
    }

    /* ⭐ CADRE RÉTRO MODULABLE ⭐ */
    .cadre-retro {
        width: 900px;
        margin: 40px auto;
        padding: 40px;
        border: 4px double #5a3e2b; /* bordure rétro années 50 */
        border-radius: 12px;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .sous-titre {
        font-weight: bold;
        font-size: 1.4em;
        margin: 25px 0 10px;
        text-align: center;
        color: #5a3e2b;
    }

    .image-article {
        display: block;
        margin: 0 auto 30px;
        max-width: 90%;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    footer {
        text-align: center;
        margin: 40px 0 20px;
        font-size: 0.9em;
        color: #7a6a5f;
    }
</style>
</head>

<body>

<header>
    <h1>Titre de ton article</h1>
    <div class="date">Publié le : 21/08/2026</div>
</header>

<!-- ⭐ CHOIX DU FOND INTÉRIEUR ⭐ -->
<!-- Pour l'école autrefois : -->
<!-- <div class="cadre-retro" style="background-image: url('images/FOND-ECOLE.png');"> -->

<!-- Pour les vieux métiers : -->
<div class="cadre-retro" style="background-image: url('images/FOND-METIERS.jpg');">

    <div class="sous-titre">Sous-titre de section</div>
    <p>Ton texte ici…</p>

    <img class="image-article" src="images/ton-image.jpg" alt="Illustration">

    <div class="sous-titre">Autre section</div>
    <p>Ton texte ici…</p>

</div>

<footer>
    © 2026 — Pour que je me souvienne
</footer>

</body>
</html>
