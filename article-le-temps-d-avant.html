<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Article rétro – Pour que je me souvienne</title>

<style>
    body {
        background-color: #f7f3e9; /* ton fond beige */
        font-family: "Georgia", serif;
        margin: 0;
        padding: 0;
        color: #ffffff; /* texte blanc */
    }

    header {
        text-align: center;
        padding: 40px 20px 10px;
        color: #5a3e2b;
    }

    header h1 {
        font-size: 2.4em;
        margin-bottom: 8px;
    }

    header .date {
        font-size: 1em;
        color: #7a6a5f;
    }

    /* ⭐ CADRE RÉTRO AVEC FLOU LÉGER ⭐ */
    .cadre-retro {
        width: 900px;
        margin: 40px auto;
        padding: 40px;
        border: 6px double #5a3e2b; /* bordure rétro années 50 */
        border-radius: 12px;
        background-image: url('images/FOND-METIERS.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        position: relative;
        overflow: hidden;
    }

    /* ⭐ FLOU LÉGER SUR LE FOND ⭐ */
    .cadre-retro::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: inherit;
        background-size: inherit;
        background-position: inherit;
        background-repeat: inherit;
        filter: blur(4px); /* flou léger */
        opacity: 0.75; /* adoucit le fond */
        z-index: 0;
    }

    /* ⭐ CONTENU PAR-DESSUS LE FLOU ⭐ */
    .cadre-retro > * {
        position: relative;
        z-index: 1;
    }

    .sous-titre {
        font-weight: bold;
        font-size: 1.6em;
        margin: 25px 0 10px;
        text-align: center;
        color: #ffffff; /* blanc */
        text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }

    .image-article {
        display: block;
        margin: 0 auto 30px;
        max-width: 90%;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    footer {
        text-align: center;
        margin: 40px 0 20px;
        font-size: 0.9em;
        color: #7a6a5f;
    }
</style>
</head>

<body>

<header>
    <h1>Titre de ton article</h1>
    <div class="date">Publié le : 21/08/2026</div>
</header>

<div class="cadre-retro">

    <div class="sous-titre">Sous-titre de section</div>
    <p>Ton texte ici…</p>

    <img class="image-article" src="images/ton-image.jpg" alt="Illustration">

    <div class="sous-titre">Autre section</div>
    <p>Ton texte ici…</p>

</div>

<footer>
    © 2026 — Pour que je me souvienne
</footer>

</body>
</html>
