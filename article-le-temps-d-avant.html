<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le temps d’avant ! – Pour que je me souvienne</title>

<style>
    body {
        background-color: #f7f3e9; /* ton fond beige */
        font-family: "Georgia", serif;
        margin: 0;
        padding: 0;
        color: #ffffff; /* texte blanc dans le cadre */
    }

    header {
        text-align: center;
        padding: 40px 20px 10px;
        color: #5a3e2b;
    }

    header h1 {
        font-size: 2.4em;
        margin-bottom: 8px;
    }

    header .date {
        font-size: 1em;
        color: #7a6a5f;
    }

    /* ⭐ CADRE RÉTRO VIEUX MÉTIERS ⭐ */
    .cadre-retro {
        width: 900px;
        margin: 40px auto;
        padding: 40px;
        border: 6px double #5a3e2b; /* bordure rétro */
        border-radius: 12px;
        background-image: url('images/FOND-METIERS.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        box-shadow: 0 8px 25px rgba(0,0,0,0.35); /* ombre douce */
        position: relative;
        overflow: hidden;
    }

    /* ⭐ FLOU LÉGER SUR LE FOND ⭐ */
    .cadre-retro::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: inherit;
        background-size: inherit;
        background-position: inherit;
        background-repeat: inherit;
        filter: blur(4px); /* flou léger */
        opacity: 0.75; /* adoucit le fond */
        z-index: 0;
    }

    /* ⭐ CONTENU PAR-DESSUS LE FLOU ⭐ */
    .cadre-retro > * {
        position: relative;
        z-index: 1;
    }

    .sous-titre {
        font-weight: bold;
        font-size: 1.6em;
        margin: 25px 0 10px;
        text-align: center;
        color: #ffffff;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }

    .image-article {
        display: block;
        margin: 0 auto 30px;
        max-width: 90%;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

</style>
</head>

<body>

<header>
    <h1>Le temps d’avant !</h1>
    <div class="date">Publié le : 29/01/2026</div>
</header>

<!-- ⭐ CADRE RÉTRO – TU INSÈRES TON TEXTE ET TES IMAGES ICI ⭐ -->
<div class="cadre-retro">

    <!-- Exemple de sous-titre (à modifier ou supprimer) -->
    <div class="sous-titre">Ton sous-titre ici</div>

    <!-- Exemple d’image (à modifier ou supprimer) -->
    <img class="image-article" src="images/ton-image.jpg" alt="">

    <!-- Exemple de texte (à modifier ou supprimer) -->
    <p>Ton texte ici…</p>

</div>

</body>
</html>
