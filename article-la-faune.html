<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nature & Animaux - Coups de coeur</title>

    <meta name="description" content="Rubrique qui s'intéressera à la nature et aux animaux">

    <!-- Police Yellowtail -->
    <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">

<style>
body {
    background:#f7f3e9;
    font-family:"Book Antiqua", Palatino;
}

/* --- CONTENEUR GLOBAL --- */
.scene-faune {
    width:92%;
    max-width:900px;
    margin:80px auto;
    position:relative;
}

/* --- TRONC + ANIMAUX DERRIÈRE --- */
.tronc-back {
    position:absolute;
    top:-40px;
    left:50%;
    transform:translateX(-50%) scale(0.55);
    width:600px;
    height:auto;
    z-index:-1;
    opacity:0.85;
}

/* --- TRONC + ANIMAUX DEVANT --- */
.tronc-front {
    position:absolute;
    bottom:-30px;
    right:20px;
    transform:scale(0.45);
    width:600px;
    height:auto;
    z-index:3;
    opacity:0.95;
}

/* --- HÉRISSON DEVANT --- */
.herisson {
    position:absolute;
    bottom:-20px;
    left:10px;
    transform:scale(0.40);
    width:400px;
    height:auto;
    z-index:4;
}

/* --- CADRE ORGANIQUE --- */
.cadre-organique {
    background:rgba(255,255,255,0.90);
    padding:45px;
    border-radius:70px 50px 80px 60px;
    border:4px solid #c7b89a;
    box-shadow:0 0 30px rgba(0,0,0,0.30);
    position:relative;
    z-index:2;
}

/* --- TITRE --- */
.faune-title {
    background:#e8dfcf;
    padding:18px 28px;
    border-radius:30px;
    border:1px solid #b8a892;
    font-size:26pt;
    font-weight:bold;
    color:#5a4a3a;
    text-align:center;
    margin-bottom:40px;
    box-shadow:0 0 12px rgba(0,0,0,0.18);
}

/* --- PHOTO (UNE SEULE VERSION) --- */
.faune-photo {
    background:none;
    padding:0;
    border:none;
    border-radius:0;
    box-shadow:none;
    margin-bottom:20px;
}

.faune-photo img {
    width: 95%;
    max-width: none;
    height: auto;
    display: block;
    margin: 0 auto;
    transform: rotate(-3deg);
    border-radius: 0;
    box-shadow: none;
}

/* --- TEXTE --- */
.faune-text {
    font-size:17pt;
    color:#5a4a3a;
    line-height:1.7;
    margin-bottom:40px;
}

/* --- NOTE NATURE --- */
.faune-note {
    background:#f7f3e9;
    padding:22px;
    border-left:8px solid #7a8f6a;
    border-radius:18px;
    font-size:15pt;
    color:#4a3f35;
    font-style:italic;
    box-shadow:0 0 14px rgba(0,0,0,0.15);
    margin-bottom:45px;
}

/* --- GIF ANIMÉ --- */
.faune-gif {
    width:100%;
    text-align:center;
    margin:40px 0;
}
.faune-gif img {
    max-width:100%;
    height:auto;
    max-height:120px;
}

/* --- SÉPARATEUR --- */
.faune-separator {
    width:75%;
    height:4px;
    background:linear-gradient(to right, #7a8f6a, #c7b89a);
    margin:45px auto;
    border-radius:4px;
}

/* --- SIGNATURE --- */
.faune-signature {
    text-align:center;
    margin-top:25px;
}
.faune-signature span {
    font-family:Yellowtail;
    color:#3d2f24;
    font-size:28px;
    text-shadow:1px 1px 1px #bfbfbf;
}
.faune-signature a {
    color:#1DA1F2;
    font-size:15px;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="scene-faune">

    <!-- TRONC + ANIMAUX DERRIÈRE -->
    <img src="images/tronc-animaux.png" class="tronc-back" alt="Décor forêt">

    <!-- TRONC + ANIMAUX DEVANT -->
    <img src="images/tronc-animaux.png" class="tronc-front" alt="Animaux devant">

    <!-- HÉRISSON DEVANT -->
    <img src="images/herisson.png" class="herisson" alt="Hérisson">

    <!-- CADRE ORGANIQUE -->
    <div class="cadre-organique">

        <div class="faune-title">
            Nature & Animaux — Faune sauvage
        </div>

        <!-- ⭐ IMAGE DU TRONC DANS LE CADRE (la bonne) ⭐ -->
        <div class="faune-photo">
            <img src="images/tronc-animaux.png" alt="Tronc et animaux">
        </div>

        <p class="faune-text">
            Beauté, douceur, respect… un espace dédié au vivant.
        </p>

        <div class="faune-note">
            🌱 Note nature :  
            Ajoute ici une observation, une anecdote ou une découverte sur la faune.
        </div>

        <!-- GIF ANIMÉ -->
        <div class="faune-gif">
            <img src="images/barre-automne-ecureuilSonnetteCenterblog.gif" alt="Séparateur animé">
        </div>

        <div class="faune-separator"></div>

        <p class="faune-signature">
            <span>@fred</span><br>
            <a href="https://fred-hub159.github.io/pourquejemesouvienne">
                https://fred-hub159.github.io/pourquejemesouvienne
            </a>
        </p>

    </div>
</div>

</body>
</html>
