<style>
@keyframes clocloBreath {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.03); }
    100% { transform: scale(1); }
}

@keyframes clocloStarTwinkle {
    0%   { opacity: 0.2; transform: scale(1); }
    50%  { opacity: 1;   transform: scale(1.3); }
    100% { opacity: 0.2; transform: scale(1); }
}
</style>



<div style="
    max-width: 900px;
    margin: 0 auto;
    padding: 40px;
    border-radius: 40px;

    /* Cadre extérieur violet */
    background: linear-gradient(135deg,
        rgba(200,150,255,0.55),
        rgba(180,120,255,0.55),
        rgba(220,150,255,0.55)
    );

    /* Animation respiration */
    animation: clocloBreath 4s infinite ease-in-out;
">

    <div style="
        padding: 20px;
        border-radius: 30px;
        background: url('https://fred-hub159.github.io/pourquejemesouvienne/images/texture-intermediaire.gif') repeat;
        box-shadow: inset 0 0 35px rgba(0,0,0,0.35);
    ">

        <div style="
            position: relative;
            padding: 20px;
            border-radius: 20px;
            background: url('https://fred-hub159.github.io/pourquejemesouvienne/images/texture-interieure.gif') repeat;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.35);
        ">

            <!-- ⭐ Paillettes moyennes violettes animées autour du blanc -->
            <div style="
                position: absolute;
                top: -10px; left: -10px; right: -10px; bottom: -10px;
                pointer-events: none;
            ">
                <!-- 12 étoiles moyennes violettes -->
                <div style="position:absolute; top:10px; left:50%; width:14px; height:14px; background:rgba(200,150,255,0.9); border-radius:50%; animation:clocloStarTwinkle 2s infinite;"></div>
                <div style="position:absolute; top:50%; left:10px; width:14px; height:14px; background:rgba(200,150,255,0.9); border-radius:50%; animation:clocloStarTwinkle 2.2s infinite;"></div>
                <div style="position:absolute; top:50%; right:10px; width:14px; height:14px; background:rgba(200,150,255,0.9); border-radius:50%; animation:clocloStarTwinkle 2.4s infinite;"></div>
                <div style="position:absolute; bottom:10px; left:50%; width:14px; height:14px; background:rgba(200,150,255,0.9); border-radius:50%; animation:clocloStarTwinkle 2.1s infinite;"></div>

                <!-- coins -->
                <div style="position:absolute; top:15px; left:15px; width:16px; height:16px; background:rgba(220,150,255,0.9); border-radius:50%; animation:clocloStarTwinkle 2.3s infinite;"></div>
                <div style="position:absolute; top:15px; right:15px; width:16px; height:16px; background:rgba(220,150,255,0.9); border-radius:50%; animation:clocloStarTwinkle 2.5s infinite;"></div>
                <div style="position:absolute; bottom:15px; left:15px; width:16px; height:16px; background:rgba(220,150,255,0.9); border-radius:50%; animation:clocloStarTwinkle 2.6s infinite;"></div>
                <div style="position:absolute; bottom:15px; right:15px; width:16px; height:16px; background:rgba(220,150,255,0.9); border-radius:50%; animation:clocloStarTwinkle 2.7s infinite;"></div>
            </div>

            <div style="background:#ffffff; padding:20px; border-radius:15px;">
                <!-- Ton contenu intérieur -->
            </div>

        </div>
    </div>
</div>
