<style>
@keyframes clocloBreath {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.03); }
    100% { transform: scale(1); }
}

@keyframes clocloTwinkle {
    0%   { opacity: 0.2; transform: scale(1); }
    50%  { opacity: 1;   transform: scale(1.3); }
    100% { opacity: 0.2; transform: scale(1); }
}
</style>




<div style="
    max-width: 900px;
    margin: 0 auto;
    padding: 40px;
    border-radius: 40px;

    background: linear-gradient(135deg,
        rgba(200,150,255,0.55),
        rgba(180,120,255,0.55),
        rgba(220,150,255,0.55)
    );

    animation: clocloBreath 4s infinite ease-in-out;
">

    <div style="
        padding: 20px;
        border-radius: 30px;
        background: url('https://fred-hub159.github.io/pourquejemesouvienne/images/texture-intermediaire.gif') repeat;
        box-shadow: inset 0 0 35px rgba(0,0,0,0.35);
    ">

        <div style="
            position: relative;
            padding: 20px;
            border-radius: 20px;
            background: url('https://fred-hub159.github.io/pourquejemesouvienne/images/texture-interieure.gif') repeat;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.35);
        ">

            <!-- ✦ Éclats de lumière + ♫ Double croches -->
            <div style="
                position: absolute;
                top: -10px; left: -10px; right: -10px; bottom: -10px;
                pointer-events: none;
            ">

                <!-- ✦ Éclats de lumière (4 branches) -->
                <div style="position:absolute; top:10px; left:50%; width:20px; height:20px; animation:clocloTwinkle 2s infinite;">
                    <div style="position:absolute; top:9px; left:0; right:0; height:2px; background:rgba(220,150,255,0.9);"></div>
                    <div style="position:absolute; left:9px; top:0; bottom:0; width:2px; background:rgba(220,150,255,0.9);"></div>
                </div>

                <div style="position:absolute; bottom:10px; left:50%; width:20px; height:20px; animation:clocloTwinkle 2.3s infinite;">
                    <div style="position:absolute; top:9px; left:0; right:0; height:2px; background:rgba(220,150,255,0.9);"></div>
                    <div style="position:absolute; left:9px; top:0; bottom:0; width:2px; background:rgba(220,150,255,0.9);"></div>
                </div>

                <!-- ♫ Double croches -->
                <div style="position:absolute; top:15px; left:15px; width:16px; height:30px; animation:clocloTwinkle 2.4s infinite;">
                    <div style="width:4px; height:20px; background:rgba(180,120,255,0.9); position:absolute; left:6px; top:0;"></div>
                    <div style="width:10px; height:4px; background:rgba(180,120,255,0.9); position:absolute; left:3px; top:0;"></div>
                    <div style="width:10px; height:4px; background:rgba(180,120,255,0.9); position:absolute; left:3px; top:8px;"></div>
                    <div style="width:10px; height:10px; background:rgba(180,120,255,0.9); border-radius:50%; position:absolute; left:3px; top:18px;"></div>
                </div>

                <div style="position:absolute; bottom:15px; right:15px; width:16px; height:30px; animation:clocloTwinkle 2.6s infinite;">
                    <div style="width:4px; height:20px; background:rgba(180,120,255,0.9); position:absolute; left:6px; top:0;"></div>
                    <div style="width:10px; height:4px; background:rgba(180,120,255,0.9); position:absolute; left:3px; top:0;"></div>
                    <div style="width:10px; height:4px; background:rgba(180,120,255,0.9); position:absolute; left:3px; top:8px;"></div>
                    <div style="width:10px; height:10px; background:rgba(180,120,255,0.9); border-radius:50%; position:absolute; left:3px; top:18px;"></div>
                </div>

            </div>

            <div style="background:#ffffff; padding:20px; border-radius:15px;">
                <!-- Ton contenu intérieur -->
            </div>

        </div>
    </div>
</div>
