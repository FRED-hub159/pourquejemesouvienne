<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cadre Cloclo</title>

<style>
@keyframes clocloBreath {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.03); }
    100% { transform: scale(1); }
}
</style>

</head>
<body style="background:#f0f0f0; font-family:Arial, sans-serif;">

<!-- ⭐ Cadre extérieur qui respire -->
<div style="animation: clocloBreath 4s infinite ease-in-out;">

    <!-- ⭐ Cadre violet -->
    <div style="
        max-width: 900px;
        margin: 0 auto;
        padding: 40px;
        border-radius: 40px;
        background: linear-gradient(135deg,
            rgba(200,150,255,0.55),
            rgba(180,120,255,0.55),
            rgba(220,150,255,0.55)
        );
    ">

        <!-- ⭐ Texture intermédiaire -->
        <div style="
            padding: 20px;
            border-radius: 30px;
            background: url('https://fred-hub159.github.io/pourquejemesouvienne/images/texture-intermediaire.gif') repeat;
            box-shadow: inset 0 0 35px rgba(0,0,0,0.35);
        ">

            <!-- ⭐ Texture intérieure -->
            <div style="
                padding: 20px;
                border-radius: 20px;
                background: url('https://fred-hub159.github.io/pourquejemesouvienne/images/texture-interieure.gif') repeat;
                box-shadow: inset 0 0 25px rgba(0,0,0,0.35);
            ">

                <!-- ⭐ Zone blanche stable (ne bouge pas) -->
                <div style="background:#ffffff; padding:20px; border-radius:15px;">

                    <!-- ⭐ TON CONTENU INTÉRIEUR (texte + images + vidéos) -->
                    <div style="text-align:center; max-width:700px; margin:0 auto;">

                        <!-- TITRE -->
                        <h2 style="margin-bottom:20px; font-size:28px; color:#5a2ea6;">
                            Mon titre ici
                        </h2>

                        <!-- TEXTE -->
                        <p style="font-size:18px; line-height:1.6; margin-bottom:30px;">
                            Votre texte ici. Vous pouvez écrire plusieurs paragraphes,
                            raconter une anecdote, présenter une chanson, un souvenir,
                            ou introduire vos images et vidéos.
                        </p>

                        <!-- IMAGE 1 -->
                        <div style="margin:25px 0;">
                            <img src="" alt="Image 1" style="max-width:100%; border-radius:12px;">
                        </div>

                        <!-- IMAGE 2 -->
                        <div style="margin:25px 0;">
                            <img src="" alt="Image 2" style="max-width:100%; border-radius:12px;">
                        </div>

                        <!-- VIDÉO 1 -->
                        <div style="margin:35px 0;">
                            <iframe width="560" height="315"
                                src=""
                                title="Vidéo 1"
                                frameborder="0"
                                allowfullscreen
                                style="border-radius:12px;">
                            </iframe>
                        </div>

                        <!-- VIDÉO 2 -->
                        <div style="margin:35px 0;">
                            <iframe width="560" height="315"
                                src=""
                                title="Vidéo 2"
                                frameborder="0"
                                allowfullscreen
                                style="border-radius:12px;">
                            </iframe>
                        </div>

                    </div>
                    <!-- ⭐ FIN DU CONTENU INTÉRIEUR -->

                </div>
                <!-- ⭐ FIN zone blanche -->

            </div>
            <!-- ⭐ FIN texture intérieure -->

        </div>
        <!-- ⭐ FIN texture intermédiaire -->

    </div>
    <!-- ⭐ FIN cadre violet -->

</div>
<!-- ⭐ FIN cadre respirant -->

</body>
</html>
