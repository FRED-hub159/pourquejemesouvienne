<style>
@keyframes clocloStars {
    0%   { opacity: 0.2; transform: scale(1); }
    50%  { opacity: 0.9; transform: scale(1.3); }
    100% { opacity: 0.2; transform: scale(1); }
}
</style>


<div style="
    max-width: 900px;
    margin: 0 auto;
    padding: 40px;
    border-radius: 40px;

    /* Cadre extérieur violet */
    border: 12px solid transparent;
    background: linear-gradient(135deg,
        rgba(200,150,255,0.55),
        rgba(180,120,255,0.55),
        rgba(220,150,255,0.55)
    ) border-box;

    /* Halo violet animé */
    animation: clocloStars 3s infinite ease-in-out;
">

    <div style="
        padding: 20px;
        border-radius: 30px;
        background: url('https://fred-hub159.github.io/pourquejemesouvienne/images/texture-intermediaire.gif') repeat;
        box-shadow: inset 0 0 35px rgba(0,0,0,0.35);
    ">

        <div style="
            padding: 20px;
            border-radius: 20px;
            background: url('https://fred-hub159.github.io/pourquejemesouvienne/images/texture-interieure.gif') repeat;
            box-shadow:
                inset 0 0 25px rgba(0,0,0,0.35),
                /* Paillettes moyennes violettes autour du blanc */
                inset 0 0 15px rgba(200,150,255,0.55),
                inset 0 0 35px rgba(180,120,255,0.45),
                inset 0 0 55px rgba(220,150,255,0.35);
            animation: clocloStars 2.5s infinite ease-in-out;
        ">

            <div style="background:#ffffff; padding:20px; border-radius:15px;">
                <!-- Ton contenu intérieur -->
            </div>

        </div>
    </div>
</div>
