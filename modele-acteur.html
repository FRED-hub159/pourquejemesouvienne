<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modèle Acteur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            border: 4px solid #c0c0c0;
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .portrait {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .bio {
            font-size: 16px;
            line-height: 1.5;
            color: #000;
        }

        /* Formulaire passe-partout */
        .comment-box {
            margin-top: 50px;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #999;
        }

        .comment-box h2 {
            text-align: center;
            margin-top: 0;
            color: #000;
        }

        .comment-box input,
        .comment-box textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #999;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .comment-box button {
            padding: 10px 20px;
            background: #b0b0b0;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Module commentaires publiés */
        .published-comments {
            margin-top: 30px;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #999;
        }

        .published-comments h3 {
            text-align: center;
            margin-top: 0;
            color: #000;
        }

        .published-comments p {
            font-size: 15px;
            color: #000;
            margin-bottom: 10px;
        }

        .signature {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Nom de l'acteur (Année - Année)</h1>

        <img src="portrait.jpg" alt="Portrait de l'acteur" class="portrait">

        <p class="bio">
            Ici, tu écris la biographie de l'acteur.  
            Tu peux mettre plusieurs paragraphes, raconter sa vie, sa carrière, etc.
        </p>

        <div class="signature">
            @fred<br>
            https://fred-hub159.github.io/pourquejemesouvienne
        </div>

        <!-- FORMULAIRE PASSE-PARTOUT -->
        <div class="comment-box">
            <h2>Laisser un commentaire</h2>

            <form action="https://formspree.io/f/xljrlnye" method="POST">

                <label>Votre nom :</label>
                <input type="text" name="nom" required>

                <label>Votre message :</label>
                <textarea name="message" required></textarea>

                <div style="text-align:center;">
                    <button type="submit">Envoyer</button>
                </div>

            </form>
        </div>

        <!-- COMMENTAIRES PUBLIÉS -->
        <div class="published-comments">
            <h3>Commentaires publiés</h3>

            <!-- Exemple à remplacer -->
            <!--
            <p><strong>Magalou :</strong> C'est un bon début !</p>
            -->

        </div>

    </div>

</body>
</html>
