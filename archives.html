/* --- Structure générale --- */
body {
    font-family: Arial, sans-serif;
    background-color: #f7f7f7;
    margin: 0;
    padding: 0;
}

/* --- Menu --- */
.menu {
    text-align: center;
    padding: 15px;
    background-color: #ffffff;
    border-bottom: 2px solid #e0e0e0;
    font-size: 18px;
}

.menu a {
    color: #1DA1F2;
    text-decoration: none;
    margin: 0 10px;
}

/* --- Cadre principal --- */
.container {
    width: 80%;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid #dcdcdc;
}

/* --- Titres --- */
h1 {
    text-align: center;
    margin-top: 0;
}

.section-title {
    font-size: 22px;
    margin-top: 30px;
    margin-bottom: 10px;
    color: #1DA1F2;
}

/* --- Listes principales --- */
.archive-list {
    list-style: none;
    padding: 0;
}

.archive-item {
    padding: 10px;
    border: 1px solid #e0e0e0;
    margin-bottom: 8px;
    border-radius: 8px;
    background: #fafafa;
    position: relative;
}

/* --- Panneaux au survol --- */
.archive-item:hover .panel {
    display: block;
}

.panel {
    display: none;
    position: absolute;
    left: 250px;
    top: 0;
    width: 250px;
    background: white;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    padding: 15px;
    z-index: 10;
}

/* --- Mois --- */
.month-list {
    list-style: none;
    padding-left: 10px;
}

.month-list li {
    padding: 3px 0;
}

</style>
