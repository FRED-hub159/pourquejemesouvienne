<!DOCTYPE html>
<html lang="fr">
<style>
    body {
        font-family: "Georgia", serif;
        background: #f7f3e9;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 900px;
        background: #fffdf7;
        margin: 40px auto;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        line-height: 1.7;
        border: 1px solid #e6dcc4;
    }

    nav {
        text-align: center;
        margin-bottom: 30px;
        font-size: 18px;
    }

    nav a {
        color: #003366;
        text-decoration: none;
        margin: 0 10px;
        font-weight: bold;
    }

    nav a:hover {
        text-decoration: underline;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 34px;
        color: #5a4632;
        font-family: "Georgia", serif;
    }

    h2 {
        margin-top: 40px;
        color: #5a4632;
        border-left: 5px solid #c7b08a;
        padding-left: 12px;
        font-size: 26px;
    }

    p {
        margin-top: 20px;
        font-size: 19px;
        color: #4a3f35;
    }

    ul {
        margin-top: 10px;
        margin-bottom: 20px;
        margin-left: 20px;
        font-size: 18px;
        color: #4a3f35;
    }
</style>

<body>

<div class="container">

    ... ton menu ...
    ... ton contenu ...

</div>

</body>
</html>
