<div style="
    margin:30px auto;
    background:#f7f3e9;

    width:92%;
    max-width:600px;
    box-sizing:border-box;
    border:1px solid #ccc;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
">

    <h2 style="text-align:center; color:#000; margin-bottom:20px; font-size:22px;">
        📩 Me contacter
    </h2>

    <form action="https://api.web3forms.com/submit" method="POST" style="color:#000;">

        <input type="hidden" name="access_key" value="b1b4f4e4-1f5c-4c2b-9f7d-7e2f8c9d3a1f">

        <!-- Nom -->
        <div style="display:flex; align-items:center; margin-bottom:12px;">
            <label style="width:120px; font-weight:bold;">Nom *</label>
            <input type="text" name="nom" required
                   style="flex:1; padding:8px; border-radius:6px; border:1px solid #999;">
        </div>

        <!-- Email -->
        <div style="display:flex; align-items:center; margin-bottom:12px;">
            <label style="width:120px; font-weight:bold;">Email *</label>
            <input type="email" name="email" required
                   style="flex:1; padding:8px; border-radius:6px; border:1px solid #999;">
        </div>

        <!-- Titre -->
        <div style="display:flex; align-items:center; margin-bottom:12px;">
            <label style="width:120px; font-weight:bold;">Titre *</label>
            <input type="text" name="titre" required
                   style="flex:1; padding:8px; border-radius:6px; border:1px solid:#999;">
        </div>

        <!-- Message -->
        <div style="display:flex; align-items:flex-start; margin-bottom:12px;">
            <label style="width:120px; font-weight:bold; margin-top:4px;">Message *</label>
            <textarea name="message" required
                      style="flex:1; height:120px; padding:8px; border-radius:6px; border:1px solid #999;"></textarea>
        </div>

        <div style="text-align:center; margin-top:15px;">
            <button type="submit"
                    style="
                        padding:8px 20px;
                        background:#1DA1F2;
                        color:#fff;
                        border:none;
                        border-radius:6px;
                        font-weight:bold;
                        cursor:pointer;
                        transition:0.2s;
                    "
                    onmouseover="this.style.background='#4db3ff';"
                    onmouseout="this.style.background='#1DA1F2';">
                envoyer
            </button>
        </div>

    </form>
