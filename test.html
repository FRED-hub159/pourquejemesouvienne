
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadre Manolamodernisé</title>
<style>
body{
background:#ececec;
margin:0;
padding:20px;
font-family:Georgia,serif;
}
.cadre{
max-width:900px;
margin:auto
}
.img{
display:block;
width:100%;
height:auto
}
.centre{
background:url('images/w19centre.png') repeat-y center top;
background-size:100% auto;
padding:40px 8%;
color:#3a2d1b;
line-height:1.8;
font-size:1.1rem
}
.contenu{
background:rgba(255,253,245,.75);
padding:20px;
border-radius:12px
}
.titre{
text-align:center
}
</style>
</head>
<body>
<div class="cadre">
img class="img" src="images/w19haut.png" alt="haut"
<div class="centre">
<div class="contenu">
<h1 class="titre">Cadre Manola modernisé</h1>
<p>Remplace ce texte par ton contenu.</p>
<p>Compatible PC, tablette et smartphone.</p>
</div>
</div>
img class="img" src="images/w19bas.png" alt="bas"
</div>
</body>
</html>
