
<style>

/* ⭐ Cadre extérieur élargi */
.cadre-vertical {
    background-color: black;
    border: 14px solid #cc99ff;        /* Bordure extérieure violette plus large */
    box-shadow: 0 0 0 22px #663399;    /* Bordure intérieure violette */
    width: 600px;                      /* Format portrait */
    margin: 40px auto;
    padding: 35px;                     /* Espace noir entre les deux cadres */
    border-radius: 28px;
    position: relative;
    overflow: hidden;
    text-align: center;
}

/* ⭐ Étoiles très fines, plus denses, dans l’espace noir entre les deux cadres */
.cadre-vertical::before {
    content: "";
    position: absolute;
    inset: 0;

    /* Trois couches d’étoiles fines pour plus de densité */
    background-image:
        radial-gradient(#ffffff 1px, transparent 2px),
        radial-gradient(#cc99ff 1px, transparent 2px),
        radial-gradient(#ffffff 1px, transparent 2px);

    /* Tailles différentes pour un effet plus riche */
    background-size:
        90px 90px,
        140px 140px,
        60px 60px;

    /* Animation douce */
    animation: etoiles 14s linear infinite;

    opacity: 0.45; /* Plus visible mais toujours élégant */
    pointer-events: none;
    z-index: 0;
}

/* ⭐ Animation des étoiles fines */
@keyframes etoiles {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-40px, -20px); }
    100% { transform: translate(0, 0); }
}

/* ⭐ Cadre intérieur */
.cadre-interieur {
    background-color: black;           /* Fond noir uni */
    border: 6px solid #cc99ff;         /* Bordure intérieure violette */
    border-radius: 18px;
    padding: 30px;

    width: 500px;          /* ← FIXE LA LARGEUR = cadre vertical */
    margin: 0 auto;        /* ← centre le cadre intérieur */
    box-sizing: border-box;
    
    position: relative;
    z-index: 1;                        /* Devant les étoiles */
}

/* ⭐ Lignes scintillantes internes */
.ligne-etoiles {
    height: 4px;
    background: linear-gradient(
        to right,
        transparent,
        #f2d9ff,
        #cc99ff,
        #f2d9ff,
        transparent
    );
    animation: scintille 2s linear infinite;
    margin: 15px 0;
    position: relative;
    z-index: 2;
}

/* ⭐ Animation scintillante des lignes */
@keyframes scintille {
    0%   { opacity: 0.3; }
    50%  { opacity: 1; }
    100% { opacity: 0.3; }
}

</style>







<div class="cadre-vertical">

    <div class="cadre-interieur">

        <!-- Ligne scintillante au-dessus du titre -->
        <div class="ligne-etoiles"></div>

        <!-- Titre -->
        <div style="color:#cc99ff; font-size:28px; font-weight:bold; text-align:center;">
            BRIGITTE BARDOT
        </div>

        <!-- Sous-titre -->
        <div style="color:#f2d9ff; font-size:20px; text-align:center; margin-bottom:15px;">
            (28 septembre 1934 - 28 décembre 2025)
        </div>

        <!-- Ligne scintillante sous le titre -->
        <div class="ligne-etoiles"></div>

        <!-- Ton image verticale -->
        <img src="https://picsum.photos/500/700"
             alt="Image test"
             style="max-width:100%; border-radius:12px; margin:25px 0; position:relative; z-index:2;">

        <!-- Ligne scintillante 3 -->
        <div class="ligne-etoiles"></div>

        <!-- Ligne scintillante 4 -->
        <div class="ligne-etoiles"></div>

    </div>

</div>
