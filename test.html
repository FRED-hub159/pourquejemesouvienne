
<style>

/* ⭐ Cadre vertical avec double bordure violette */
.cadre-vertical {
    background-color: black;
    border: 8px solid #cc99ff;        /* Bordure extérieure violette */
    box-shadow: 0 0 0 12px #663399;   /* Bordure intérieure violette */
    width: 600px;                     /* Plus étroit */
    margin: 40px auto;
    padding: 40px;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    text-align: center;
}

/* ⭐ Scintillement interne façon Eklablog (traits lumineux) */
.cadre-vertical::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        90deg,
        rgba(204,153,255,0.15) 0px,
        rgba(204,153,255,0.15) 2px,
        transparent 4px,
        transparent 6px
    );
    animation: scintillement 3s linear infinite;
    pointer-events: none;
    z-index: 0;
}

/* ⭐ Animation du scintillement (déplacement horizontal) */
@keyframes scintillement {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-40px); }
}

/* ⭐ Lignes scintillantes internes */
.ligne-etoiles {
    height: 4px;
    background: linear-gradient(
        to right,
        transparent,
        #f2d9ff,
        #cc99ff,
        #f2d9ff,
        transparent
    );
    animation: scintille 2s linear infinite;
    margin: 15px 0;
    position: relative;
    z-index: 1;
}

/* ⭐ Animation scintillante des lignes */
@keyframes scintille {
    0%   { opacity: 0.3; }
    50%  { opacity: 1; }
    100% { opacity: 0.3; }
}

</style>




<div class="cadre-vertical">

    <!-- Ligne scintillante 1 -->
    <div class="ligne-etoiles"></div>

    <!-- Ligne scintillante 2 -->
    <div class="ligne-etoiles"></div>

    <!-- Ton image verticale -->
    <img src="https://picsum.photos/500/700"
         alt="Image test"
         style="max-width:100%; border-radius:12px; margin:25px 0; position:relative; z-index:1;">

    <!-- Ligne scintillante 3 -->
    <div class="ligne-etoiles"></div>

    <!-- Ligne scintillante 4 -->
    <div class="ligne-etoiles"></div>

</div>
