
<style>
/* Cadre plein, double bordure violette */
.cadre-galaxie {
    background-color: black;
    border: 6px solid #cc99ff;          /* 1ère bordure violette */
    box-shadow: 0 0 0 10px #663399;     /* 2ème bordure violette (ombre fixe) */
    width: 750px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    text-align: center;
}

/* Étoiles animées autour du cadre */
.cadre-galaxie::before,
.cadre-galaxie::after {
    content: "";
    position: absolute;
    inset: -40px;
    background-image:
        radial-gradient(#ffffff 1px, transparent 3px),
        radial-gradient(#cc99ff 1px, transparent 3px);
    background-size: 80px 80px, 120px 120px;
    animation: etoiles 12s linear infinite;
    opacity: 0.6;
    pointer-events: none;
}

.cadre-galaxie::after {
    animation-direction: reverse;
    opacity: 0.4;
}

/* Animation des étoiles */
@keyframes etoiles {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-40px, -20px); }
    100% { transform: translate(0, 0); }
}

/* Lignes scintillantes internes */
.ligne-etoiles {
    height: 4px;
    background: linear-gradient(
        to right,
        transparent,
        #f2d9ff,
        #cc99ff,
        #f2d9ff,
        transparent
    );
    animation: scintille 2s linear infinite;
    margin: 12px 0;
}

@keyframes scintille {
    0%   { opacity: 0.3; }
    50%  { opacity: 1; }
    100% { opacity: 0.3; }
}
</style>



<div class="cadre-galaxie">

    <!-- Ligne 1 -->
    <div class="ligne-etoiles"></div>

    <!-- Ligne 2 -->
    <div class="ligne-etoiles"></div>

    <!-- Ton image ou ton thème -->
    <img src="https://picsum.photos/600/350"
         alt="Image test"
         style="max-width:100%; border-radius:12px; margin:25px 0; position:relative; z-index:1;">

    <!-- Ligne 3 -->
    <div class="ligne-etoiles"></div>

    <!-- Ligne 4 -->
    <div class="ligne-etoiles"></div>

</div>
