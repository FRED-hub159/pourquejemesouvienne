
<style>

/* ⭐ Cadre extérieur élargi */
.cadre-vertical {
    background-color: black;
    border: 14px solid #cc99ff;        /* Bordure extérieure violette plus large */
    box-shadow: 0 0 0 22px #663399;    /* Bordure intérieure violette */
    width: 600px;                      /* Format portrait */
    margin: 40px auto;
    padding: 60px;                     /* Espace noir entre les deux cadres */
    border-radius: 28px;
    position: relative;
    overflow: hidden;
    text-align: center;
}

/* ⭐ Étoiles très fines dans l’espace noir entre les deux cadres */
.cadre-vertical::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(#ffffff 1px, transparent 2px),
        radial-gradient(#cc99ff 1px, transparent 2px);
    background-size: 120px 120px, 180px 180px;
    animation: etoiles 12s linear infinite;
    opacity: 0.35;                     /* Très fin, très discret */
    pointer-events: none;
    z-index: 0;
}

/* ⭐ Animation des étoiles fines */
@keyframes etoiles {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-40px, -20px); }
    100% { transform: translate(0, 0); }
}

/* ⭐ Cadre intérieur */
.cadre-interieur {
    background-color: black;           /* Fond noir uni */
    border: 6px solid #cc99ff;         /* Bordure intérieure violette */
    border-radius: 18px;
    padding: 30px;
    position: relative;
    z-index: 1;                        /* Devant les étoiles */
}

/* ⭐ Lignes scintillantes internes */
.ligne-etoiles {
    height: 4px;
    background: linear-gradient(
        to right,
        transparent,
        #f2d9ff,
        #cc99ff,
        #f2d9ff,
        transparent
    );
    animation: scintille 2s linear infinite;
    margin: 15px 0;
    position: relative;
    z-index: 2;
}

/* ⭐ Animation scintillante des lignes */
@keyframes scintille {
    0%   { opacity: 0.3; }
    50%  { opacity: 1; }
    100% { opacity: 0.3; }
}

</style>






<div class="cadre-vertical">

    <div class="cadre-interieur">

        <!-- Ligne scintillante 1 -->
        <div class="ligne-etoiles"></div>

        <!-- Ligne scintillante 2 -->
        <div class="ligne-etoiles"></div>

        <!-- Ton image verticale -->
        <img src="https://picsum.photos/500/700"
             alt="Image test"
             style="max-width:100%; border-radius:12px; margin:25px 0; position:relative; z-index:2;">

        <!-- Ligne scintillante 3 -->
        <div class="ligne-etoiles"></div>

        <!-- Ligne scintillante 4 -->
        <div class="ligne-etoiles"></div>

    </div>

</div>
