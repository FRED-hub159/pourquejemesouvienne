<!-- Cadre étoilé extérieur -->
<div style="
    width: 900px;
    margin: 40px auto;
    padding: 15px;
    border-radius: 12px;
    border: 3px ridge #bdddec;
    background-image: url('images/fond-etoile.gif');
    background-size: cover;
    background-repeat: no-repeat;
">

    <!-- Cadre argenté fin -->
    <div style="
        border: 2px ridge #dcdcdc;
        border-radius: 10px;
        padding: 15px;
        background-color: transparent;
    ">

        <!-- Cadre intérieur prune profond -->
        <div style="
            background-color: #580f41; /* prune profonde */
            border-radius: 10px;
            padding: 20px;
            border: 2px ridge #730000;
            box-shadow: inset 0px 0px 10px #730000;
        ">

            <!-- Titre -->
            <p style="text-align: center; margin: 0;">
                <span style="
                    font-family: Yellowtail;
                    color: #ffffff;
                    font-size: 48px;
                    text-shadow: 2px 1px 1px #000000, 1px 1px 4px #000000;
                ">
                    Olivia de Havilland
                </span>
            </p>

            <!-- Dates -->
            <p style="text-align: center; margin: 5px 0 20px 0;">
                <span style="
                    font-family: Yellowtail;
                    color: #ffffff;
                    font-size: 28px;
                    text-shadow: 2px 1px 1px #000000, 1px 1px 4px #000000;
                ">
                    (1916 - 2020)
                </span>
            </p>

            <!-- Photo -->
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="images/olivia-de-havilland.jpg"
                     alt="Olivia de Havilland"
                     style="border-radius: 6px; max-width: 100%; height: auto;">
            </div>

            <!-- Texte biographique directement sur le fond prune -->
            <div style="
                color: #ffffff;
                font-family: Verdana;
                font-size: 15px;
                line-height: 1.5;
                margin-top: 10px;
            ">
                (Tu pourras poursuivre la biographie ici, directement sur le fond prune
                #580f41. Le texte sera blanc, lisible, sans encadré, comme tu le souhaites.)
            </div>

            <!-- Signature -->
            <p style="text-align: center; margin-top: 20px;">
                <span style="
                    font-family: Yellowtail;
                    color: #ffffff;
                    font-size: 26px;
                    text-shadow: 2px 1px 1px #000000;
                ">
                    @fred
                </span>
                <br>
                <a href="http://www.creasdesign.eklablog.com/"
                   style="color: #bdddec; font-size: 14px; text-decoration: none;">
                    https://fred-hub159.github.io/pourquejemesouvienne
                </a>
            </p>

        </div>
    </div>
</div>
<!-- COMMENTAIRES (version spéciale actrice) -->
<div style="margin-top:30px; background:#ffffff; padding:25px; border-radius:12px; width:92%; max-width:700px; box-sizing:border-box; border:2px solid #999; margin-left:auto; margin-right:auto;">

    <h2 style="text-align:center; color:#000; margin-top:0;">Laisser un commentaire</h2>

    <form action="https://formspree.io/f/xljrlnye" method="POST" style="color:#000;">

        <label style="display:block; margin-top:10px;">Votre nom :</label>
        <input type="text" name="nom" required
               style="width:100%; padding:10px; border-radius:8px; margin-bottom:15px; box-sizing:border-box; border:1px solid #999;">

        <label style="display:block; margin-top:10px;">Votre message :</label>
        <textarea name="message" required
                  style="width:100%; height:150px; padding:10px; border-radius:8px; margin-bottom:15px; box-sizing:border-box; border:1px solid #999;"></textarea>

        <div style="text-align:center; margin-top:10px;">
            <button type="submit"
                    style="padding:10px 20px; background:#e0e0e0; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                Envoyer
            </button>
        </div>

    </form>
</div>

</div>
