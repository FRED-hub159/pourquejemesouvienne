
<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Télévision</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Georgia, serif;
    line-height:1.8;
    margin:0;
}

header{
    text-align:center;
    padding:60px 20px;
    background:linear-gradient(135deg,#13233f,#1f3f68);
    border-bottom:4px solid #d4af37;
}

header h1{
    margin:0;
    font-size:3rem;
    letter-spacing:3px;
}

header p{
    color:#d4af37;
    font-style:italic;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:40px;
}

h2{
    color:#d4af37;
    border-left:5px solid #d4af37;
    padding-left:15px;
}

img{
    max-width:100%;
    border-radius:10px;
}

/* =======================
   TELEVISION RETRO
   ======================= */

.tv-wrapper{
    display:flex;
    justify-content:center;
    margin:60px 0;
}

.tv{

    width:900px;
    max-width:100%;

    background:linear-gradient(
        145deg,
        #7f5a3a,
        #5e3f28
    );

    border-radius:25px;

    padding:25px;

    position:relative;

    box-shadow:
    0 15px 40px rgba(0,0,0,.6),
    inset 0 0 10px rgba(255,255,255,.15);
}

/* antennes */

.antenna-left,
.antenna-right{

    position:absolute;
    top:-115px;
    width:4px;
    height:130px;
    background:silver;
}

.antenna-left{
    left:42%;
    transform:rotate(-35deg);
}

.antenna-right{
    right:42%;
    transform:rotate(35deg);
}

/* façade */

.tv-front{

    display:flex;
    gap:25px;
    align-items:stretch;
}

/* écran */

.screen-container{

    flex:1;
}

.screen{

    position:relative;

    overflow:hidden;

    border-radius:25px;

    background:black;

    aspect-ratio:16/9;

    border:15px solid #111;

    box-shadow:
    inset 0 0 50px rgba(255,255,255,.1),
    inset 0 0 120px rgba(0,0,0,.9);

}

/* effet verre bombé */

.screen::before{

content:'';

position:absolute;
inset:0;

background:
linear-gradient(
135deg,
rgba(255,255,255,.22),
transparent 40%
);

pointer-events:none;
z-index:5;
}

.screen iframe,
.screen video{

width:100%;
height:100%;
border:none;
}

/* panneau latéral */

.controls{

width:170px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:#4e342e;

border-radius:15px;

padding:20px;
}

/* haut parleur */

.speaker{

width:100px;
height:120px;

border-radius:10px;

background:
repeating-linear-gradient(
90deg,
#777,
#777 2px,
#555 2px,
#555 4px
);

margin-bottom:30px;
}

/* boutons */

.knob{

width:55px;
height:55px;

border-radius:50%;

background:
radial-gradient(
circle at 35% 35%,
#f4d03f,
#b8860b
);

margin:10px;

box-shadow:
0 0 8px rgba(255,215,0,.5);
}

/* pieds */

.tv::before{

content:'';

position:absolute;

bottom:-20px;
left:80px;

width:100px;
height:8px;

background:#3a2518;
transform:rotate(-15deg);
}

.tv::after{

content:'';

position:absolute;

bottom:-20px;
right:80px;

width:100px;
height:8px;

background:#3a2518;
transform:rotate(15deg);
}

footer{
 text-align:center;
 padding:30px;
 color:#aaa;
}

@media(max-width:900px){

.tv-front{
flex-direction:column;
}

.controls{
width:auto;
flex-direction:row;
gap:20px;
}

.speaker{
height:70px;
width:120px;
margin-bottom:0;
}
}

</style>
</head>

<body>

<header>
<h1>📺 TÉLÉVISION</h1>
<p>Du noir et blanc au streaming</p>
</header>

<div class="container">

<h2>Un exemple d'article</h2>

<p>
Ici vous placez votre texte.
Vous pouvez raconter l'histoire de la télévision,
présenter une série ou partager un souvenir.
</p>

<div class="tv-wrapper">

<div class="tv">

<div class="antenna-left"></div>
<div class="antenna-right"></div>

<div class="tv-front">

<div class="screen-container">

<div class="screen">

<!-- VIDEO YOUTUBE -->

<iframe
src="https://www.youtube.com/embed/ID_VIDEO"
allowfullscreen>
</iframe>

<!--
OU VIDEO PERSONNELLE :

<video controls>
<source src="videos/ma-video.mp4" type="video/mp4">
</video>

-->

</div>

</div>

<div class="controls">

<div class="speaker"></div>

<div class="knob"></div>
<div class="knob"></div>

</div>

</div>

</div>

</div>

<h2>Photos</h2>

<img src="images/television.jpg" alt="Télévision ancienne">

<p>
Ajoutez ici d'autres textes,
photos ou vidéos selon vos besoins.
</p>

</div>

<footer>
Pour que je me souvienne
</footer>

</body>
</html>
