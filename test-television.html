
<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Télévision</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Georgia, serif;
    line-height:1.8;
    margin:0;
}

header{
    text-align:center;
    padding:60px 20px;
    background:linear-gradient(135deg,#13233f,#1f3f68);
    border-bottom:4px solid #d4af37;
}

header h1{
    margin:0;
    font-size:3rem;
    letter-spacing:3px;
}

header p{
    color:#d4af37;
    font-style:italic;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:40px;
}

h2{
    color:#d4af37;
    border-left:5px solid #d4af37;
    padding-left:15px;
}

img{
    max-width:100%;
    border-radius:10px;
}



/* ===================================== */
/* TELEVISION RETRO PNG */
/* ===================================== */

.tv-retro{
    position:relative;
    width:100%;
    max-width:700px;
    margin:40px auto;
}

.tv-screen{

    position:absolute;

    top:24%;
    left:16.5%;

    width:65%;
    height:43%;

    overflow:hidden;

    background:black;

    z-index:1;

   
}



/* reflet du verre */

.tv-screen::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;
    bottom:0;

    pointer-events:none;

    background:
    linear-gradient(
        130deg,
        rgba(255,255,255,0.10),
        transparent 35%
    );
    z-index:3;
}
    
/* assombrissement des bords */

.tv-screen::after{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;
    bottom:0;

    pointer-events:none;

    background:
    radial-gradient(
        ellipse at center,
        transparent 65%,
        rgba(0,0,0,0.25) 100%
    );

    z-index:2;
}

.tv-screen iframe,
.tv-screen video{
    width:100%;
    height:100%;
    border:none;
}

.tv-image{
    position:relative;
    width:100%;
    display:block;
    z-index:0;
    opacity:0.5;
}

footer{
    text-align:center;
    padding:30px;
    color:#aaa;
}

</style>
</head>

<body>

<header>
<h1>📺 TÉLÉVISION</h1>
<p>Du noir et blanc au streaming</p>
</header>

<div class="container">

<h2>Un exemple d'article</h2>

<p>
Ici vous placez votre texte.
Vous pouvez raconter l'histoire de la télévision,
présenter une série ou partager un souvenir.
</p>

<div class="tv-retro">

    <div class="tv-screen">

        <iframe
        width="100%"
        height="500"
        src="https://www.youtube.com/embed/LZlspBn_hxE?si=qmunqhQT_F7K8Qro"
        title="Vidéo YouTube"
        frameborder="0"
        allowfullscreen>
    </iframe>

    </div>

    <img
        src="images/tv-retro.png"
        alt="Télévision rétro"
        class="tv-image">

</div>


<h2>Photos</h2>

<img src="images/television.jpg" alt="Télévision ancienne">

<p>
Ajoutez ici d'autres textes,
photos ou vidéos selon vos besoins.
</p>

</div>

<footer>
Pour que je me souvienne
</footer>

</body>
</html>
